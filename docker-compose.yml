services:
  docs:
    container_name: mkdocs-docs
    build:
      context: .
      dockerfile: docker/DockerfileDocs
    ports:
      - '4009:8080'
    volumes:
      - ./docs:/app/docs
      - ./mkdocs.yml:/app/mkdocs.yml
    restart: unless-stopped
  mysql:
    image: docker.afralab.ir/library/mysql:8.4
    container_name: whatsapp-mysql
    restart: unless-stopped

    command:
      - --mysql-native-password=ON

    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-3307}:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
  redis:
    image: docker.afralab.ir/library/redis:7
    container_name: whatsapp-redis
    restart: unless-stopped
    ports:
      - '${REDIS_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  minio:
      image: docker.afralab.ir/library/minio:RELEASE.2025-09-07T16-13-09Z
      container_name: minio
      restart: unless-stopped

      command:
        - server
        - /data
        - --address
        - ":9000"
        - --console-address
        - ":9001"

      environment:
        MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
        MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

      ports:
        - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_HOST_PORT:-9003}:9000"
        - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9005}:9001"

      volumes:
        - minio_data:/data

volumes:
  mysql_data:
  redis_data:
  minio_data:
