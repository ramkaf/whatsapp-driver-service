name: whatsapp-driver-local

services:
  mysql:
    image: docker.afralab.ir/library/mysql:8.4
    restart: unless-stopped
    ports:
      - '127.0.0.1:${DB_PORT:?DB_PORT is required}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_SHADOW_DATABASE: ${DB_SHADOW_NAME:?DB_SHADOW_NAME is required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/local-init.sh:/docker-entrypoint-initdb.d/10-local-init.sh:ro
      
  redis:
    image: docker.afralab.ir/library/redis:7
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDIS_PORT:?REDIS_PORT is required}:6379'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data

  minio:
    image: docker.afralab.ir/library/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --address ':9000' --console-address ':9001'
    ports:
      - '127.0.0.1:${MINIO_PORT:?MINIO_PORT is required}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT is required}:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio_data:/data
volumes:
  mysql_data:
  redis_data:
  minio_data:
