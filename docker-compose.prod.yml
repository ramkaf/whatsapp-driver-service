name: whatsapp-driver-prod

x-app-environment: &app-environment
  env_file:
    - .env.prod
  environment:
    NODE_ENV: production
    DOTENV_CONFIG_PATH: .env.prod
    APP_PORT: '3000'
    DB_HOST: mysql
    DB_PORT: '3306'
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    MINIO_ENDPOINT: minio
    MINIO_PORT: '9000'

services:
  app:
    <<: *app-environment
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      secrets:
        - npmrc
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HOST_PORT:-3000}:3000'
    volumes:
      - app_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const prefix=(process.env.API_PREFIX||'').replace(/^\/+|\/+$/g,'');
          fetch('http://127.0.0.1:3000/'+(prefix?prefix+'/':'')+'health',
          {headers:{Authorization:'Bearer '+process.env.WA_ADMIN_API_KEY},signal:AbortSignal.timeout(4000)})
          .then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  prisma:
    <<: *app-environment
    profiles: ['tools']
    build:
      context: .
      dockerfile: Dockerfile
      target: tooling
      secrets:
        - npmrc
    entrypoint: ['pnpm', 'exec', 'prisma']
    command: ['--help']
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: public.ecr.aws/docker/library/mysql:8.4 
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP
          --host=127.0.0.1 --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE"
          --execute='SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: public.ecr.aws/docker/library/redis:7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG'
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: public.ecr.aws/y9w4h2u9/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --address ':9000' --console-address ':9001'
    ports:
      - '${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_HOST_PORT:-19010}:9000'
      - '${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-19011}:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '--fail',
          '--silent',
          'http://localhost:9000/minio/health/ready',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  minio_data:
  app_storage:

secrets:
  npmrc:
    file: .npmrc
